<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>説明会案内の下書き｜研修用の架空ページ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f8;color:#223b45;font:17px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{background:#1e3c49;color:white;padding:17px 5vw}header strong{display:block;font-size:19px}header span{font-size:13px}main{max-width:880px;margin:35px auto;padding:0 24px 45px}h1{font-size:32px;line-height:1.45;margin:15px 0}h2{font-size:23px;margin:28px 0 12px}.tag{display:inline-block;padding:4px 12px;background:#fff0bd;border-radius:4px;font-size:14px}.lead{font-size:19px;color:#4d6871}.paper{background:white;padding:24px 28px;border:1px solid #d4e0df;border-radius:9px;margin:22px 0}dl{display:grid;grid-template-columns:170px 1fr;margin:0}dt,dd{margin:0;padding:10px 0;border-bottom:1px solid #e6eeee}dt{font-weight:700}a{color:#247786}button,.button{display:inline-block;background:#287986;color:white;border:0;padding:12px 20px;border-radius:6px;font:inherit;text-decoration:none;cursor:pointer}button.secondary{background:white;color:#285c68;border:1px solid #b9cccc}label{display:block;font-weight:600;margin:15px 0 6px}input,textarea{display:block;width:100%;font:inherit;padding:10px 12px;border:1px solid #aebfc3;border-radius:5px;color:#223b45;background:white}textarea{min-height:108px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.hint,small{font-size:14px;color:#5b7077}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.status{font-weight:700;padding:12px;background:#e8f3ea}footer{max-width:880px;margin:auto;padding:10px 24px 25px;color:#60777d;font-size:14px}[hidden]{display:none!important}@media(max-width:600px){main{padding:0 18px 30px;margin:22px auto}h1{font-size:26px}.paper{padding:20px}dl{grid-template-columns:1fr}dt{padding-bottom:0;border:0}dd{padding-top:2px}.grid{grid-template-columns:1fr}}</style></head><body><header><strong>AIブーストカレッジ　練習ページ</strong><span>第4回・当初カリキュラム版　／　架空データ</span></header><main><span class="tag">入力だけを練習するフォーム</span><h1>説明会案内の下書き</h1><p class="lead">説明会ページから読み取った情報を入力し、元のページと見比べます。</p><p class="hint">外部への送信・応募登録・保存サーバーへの通信は行いません。再読み込みすると入力は消えます。</p><p><a href="recruitment.html" target="_blank" rel="noopener">説明会ページを別タブで開く</a></p><form id="draft-form" class="paper"><label for="event-name">説明会名</label><input id="event-name" name="event-name" required autocomplete="off"><div class="grid"><div><label for="event-date">開催日</label><input id="event-date" name="event-date" placeholder="例：2026年12月10日" required autocomplete="off"></div><div><label for="capacity">定員</label><input id="capacity" name="capacity" placeholder="例：30名" required autocomplete="off"></div><div><label for="start-time">開始時刻</label><input id="start-time" name="start-time" placeholder="例：16:00" required autocomplete="off"></div><div><label for="end-time">終了時刻</label><input id="end-time" name="end-time" placeholder="例：16:45" required autocomplete="off"></div></div><label for="deadline">申込期限</label><input id="deadline" name="deadline" placeholder="例：2026年12月8日 17:00" required autocomplete="off"><label for="pending">未確定の項目</label><textarea id="pending" name="pending" required></textarea><label for="source">参照元のページ・資料</label><input id="source" name="source" placeholder="説明会ページのURL、または教材名" required autocomplete="off"><div class="actions"><button type="submit">下書きを確認</button><button class="secondary" type="reset">入力を消す</button></div></form><section id="preview" class="paper" aria-live="polite" hidden><h2>入力した下書き</h2><p class="status">ブラウザ内で表示しました。外部には送信していません。</p><pre id="preview-text"></pre><p class="hint">元の説明会ページと、日時・定員・申込期限・未確定事項を見比べてください。</p><button id="save" type="button">下書きをTXTで保存</button></section></main><footer><a href="../index.html#page=17">研修スライドへ戻る</a><p>研修用の教材です。実際の採用募集や申込受付ではありません。</p></footer><script>const form=document.getElementById('draft-form'),preview=document.getElementById('preview'),output=document.getElementById('preview-text');let draft='';form.addEventListener('submit',e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();draft='【研修用の下書き】\n説明会名：'+v('event-name')+'\n開催日：'+v('event-date')+'\n開催時間：'+v('start-time')+'〜'+v('end-time')+'\n定員：'+v('capacity')+'\n申込期限：'+v('deadline')+'\n未確定：'+v('pending')+'\n参照元：'+v('source')+'\n\nこの下書きは外部へ送信していません。';output.textContent=draft;preview.hidden=false;preview.scrollIntoView({behavior:'smooth',block:'start'});});form.addEventListener('reset',()=>{draft='';preview.hidden=true;output.textContent='';});document.getElementById('save').addEventListener('click',()=>{if(!draft)return;const url=URL.createObjectURL(new Blob(['\ufeff'+draft],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='説明会案内_下書き.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});</script></body></html>

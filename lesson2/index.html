kind": "text", "filename": "A04_模範例 デモ1の会議情報.txt"}, {"id": "A01", "title": "模範例 会議前メモ", "text": "【学習用の模範例／AIの実際の出力ではありません】\n\n■ 準備会議\n11月16日（月）15:00〜15:30、オンライン。\n根拠：最新メール M02、予定 C01。\n初回メール M01 の14:00開始は、M02で変更されている。\n\n■ 説明会本番\n11月20日（金）14:00〜14:45、オンライン、定員30名、無料。\n申込期限は11月18日（水）17:00。\n根拠：企画書 D01。\n\n■ 準備すること\n人事：参加者向けFAQの不足を整理。\n採用：申込状況・当日の役割分担案を整理。\n社内広報：社内向け案内文の案を作成。\n責任者：案内公開前に内容を最終確認。\n根拠：M01、M02、D01。事前提出期限は要確認。\n\n■ 未確定・確認すること\n申込フォームURL、録画配布の有無、各担当の事前提出期限。\n根拠：D01。録画はM02でも未確定とされている。\n会議の参加用URLは教材に記載がない（C01）。\n\n■ 次にすること（提案）\n各担当が不明点をまとめ、準備会議で確認する。\nこれは資料に書かれた決定事項ではなく、メモ作成者の提案。", "kind": "text", "filename": "A01_模範例 会議前メモ.txt"}, {"id": "A02", "title": "模範例 4つの修正", "text": "【学習用の模範例／AIの実際の出力ではありません】\n\n1. 準備会議の時刻\n誤：11月16日14:00〜14:30\n正：11月16日15:00〜15:30\n根拠：M02、C01。M01は変更前の情報。\n\n2. 定員\n誤：40名 → 正：30名\n根拠：D01。\n\n3. 申込期限\n誤：11月19日17:00 → 正：11月18日17:00\n根拠：D01。\n\n4. 録画配布\n誤：全員に配布 → 正：検討中・未確定\n根拠：M02、D01。\n\n説明会本番の日時（11月20日14:00〜14:45）は正しい。会議の時刻と混同しない。", "kind": "text", "filename": "A02_模範例 4つの修正.txt"}, {"id": "A03", "title": "確認クイズの答え", "text": "1. API・MCP・コネクタ\nAPI：外部から機能やデータを利用する窓口。\nMCP：AIと外部ツールを接続する共通規格。\nコネクタ：利用者が設定して使う接続機能。\n\n2. 「回答欄に返信案を書く」と「Gmailから送信する」は同じ？\n違う。返信案は文案。送信は相手に届く操作。宛先・内容・添付・実行結果を確認する。\n\n3. 14時のメールと15時の予定がある。どうする？\n更新日時と変更の文脈を読む。この教材ではM02が変更を明記し、C01も15時なので15時。\n更新が新しいという理由だけで、すべての資料を自動的に優先しない。\n\n4. 申込フォームURLがない。AIに作らせてよい？\n実在するURLを推測させず、「要確認」とする。", "kind": "text", "filename": "A03_確認クイズの答え.txt"}, {"id": "P01", "title": "依頼文一覧", "text": "【デモ1：会議の情報を整理】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n添えたM01・M02・C01だけを読み、準備会議の「日時／形式／確認すること／未確認事項」を表にしてください。各行に根拠の資料IDを付け、時刻が異なる理由も説明してください。\n\n【デモ2：企画書も加える】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n同じ会話に追加する企画書D01と、すでに渡したM01・M02・C01を使い、会議前メモを作ってください。①準備会議 ②説明会本番 ③担当別の準備 ④未確定事項 の順に整理し、重要な記述に資料IDを付けてください。事実と提案は分けてください。\n\n【デモ3：根拠を確かめる】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\nこの会話の会議前メモを元資料と照合してください。「確認項目／回答内容／根拠の資料IDと該当箇所／一致・不一致・不明」の表を作り、会議時刻、説明会日時、定員、申込期限、録画配布、提出期限を点検してください。\n\n【演習1：会議前メモを作る】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n私は採用説明会の準備会議に参加します。次の4資料を使って、5分で読める会議前メモを作ってください。準備会議と説明会本番を分け、日時・担当別の準備・未確定事項を整理してください。古い情報があれば変更の根拠を示し、重要な記述に資料IDを付けてください。\n\n【人事担当：FAQの確認】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\nこの教材について、人事担当として準備するFAQの論点を整理してください。すでに確定している回答と、まだ回答できない質問を分け、根拠の資料IDを添えてください。応募者の個人情報は扱いません。\n\n【採用担当：準備事項の整理】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n採用担当として、申込状況の確認と当日の役割分担について準備することを表にしてください。担当・期限が資料にない場合は「要確認」にしてください。実際の申込人数は教材にないため、数字を作らないでください。\n\n【社内広報：案内文の案】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n社内広報担当として、説明会の社内案内文を200〜300字程度で作ってください。説明会の日時・定員・申込期限を入れ、URLは「準備中」、録画配布は「未確定」と明記してください。末尾に公開前の確認項目と資料IDを別枠で示してください。\n\n【責任者：公開前の確認】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n責任者として、案内公開前に確認する項目を整理してください。「確認項目／資料から分かる事実／要確認事項／確認先の提案」の表にし、事実には根拠の資料IDを付けてください。確認先の提案を既存の決定事項として書かないでください。\n\n【演習3：案内文を点検】\nこれは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\nM01・M02・C01・D01と、誤りを含む案内文E01を照合してください。「問題箇所／修正案／根拠の資料ID」の表で示し、最後に修正後の案内文を書いてください。資料だけで分からないことは「要確認」としてください。\n\n【Drive実演：Googleの教材を読む】\nGoogle Driveコネクタで次のGoogleドキュメントを参照してください。\n【ここを、自分が作成したGoogleドキュメントのURLに置き換える】\n\nこの文書は架空のメール・予定・企画書をまとめた教材です。実際のGmailやカレンダーは検索せず、この文書だけを読み、準備会議の日時と、説明会本番の日時・定員・申込期限・未確定事項を整理してください。文書の出典リンクと、教材内の資料IDを付けてください。参照できない場合はその旨を伝え、読み取ったふりをしないでください。ファイルの変更や共有はしないでください。", "kind": "text", "filename": "P01_依頼文一覧.txt"}, {"id": "S01", "title": "公式の参照先", "text": "2026年11月13日確認\n\nClaude公式：Google Workspace連携\nhttps://support.claude.com/en/articles/10166901-use-google-workspace-connectors\n\nClaude公式：コネクタの設定と権限\nhttps://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities\n\nMCP公式：MCPとは\nhttps://modelcontextprotocol.io/docs/getting-started/intro\n\nGoogle公式：Drive APIの概要\nhttps://developers.google.com/workspace/drive/api/guides/about-sdk\n\nGoogle公式：接続したアプリの管理\nhttps://support.google.com/accounts/answer/13533235?hl=ja", "kind": "text", "filename": "S01_公式の参照先.txt"}], "prompts": {"mail": {"title": "デモ1：会議の情報を整理", "text": "これは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n添えたM01・M02・C01だけを読み、準備会議の「日時／形式／確認すること／未確認事項」を表にしてください。各行に根拠の資料IDを付け、時刻が異なる理由も説明してください。", "resources": ["M01", "M02", "C01"]}, "brief": {"title": "デモ2：企画書も加える", "text": "これは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n同じ会話に追加する企画書D01と、すでに渡したM01・M02・C01を使い、会議前メモを作ってください。①準備会議 ②説明会本番 ③担当別の準備 ④未確定事項 の順に整理し、重要な記述に資料IDを付けてください。事実と提案は分けてください。", "resources": ["M01", "M02", "C01", "D01"]}, "check": {"title": "デモ3：根拠を確かめる", "text": "これは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\nこの会話の会議前メモを元資料と照合してください。「確認項目／回答内容／根拠の資料IDと該当箇所／一致・不一致・不明」の表を作り、会議時刻、説明会日時、定員、申込期限、録画配布、提出期限を点検してください。", "resources": ["M01", "M02", "C01", "D01"]}, "exercise": {"title": "演習1：会議前メモを作る", "text": "これは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n私は採用説明会の準備会議に参加します。次の4資料を使って、5分で読める会議前メモを作ってください。準備会議と説明会本番を分け、日時・担当別の準備・未確定事項を整理してください。古い情報があれば変更の根拠を示し、重要な記述に資料IDを付けてください。", "resources": ["M01", "M02", "C01", "D01"]}, "hr": {"title": "人事担当：FAQの確認", "text": "これは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\nこの教材について、人事担当として準備するFAQの論点を整理してください。すでに確定している回答と、まだ回答できない質問を分け、根拠の資料IDを添えてください。応募者の個人情報は扱いません。", "resources": ["M01", "M02", "C01", "D01"]}, "recruit": {"title": "採用担当：準備事項の整理", "text": "これは研修用の架空データを使う練習です。実際の送信・予定登録・ファイル変更はせず、回答欄に結果を書いてください。資料にない情報は「要確認」とし、推測で補わないでください。\n\n採用担当として、申込状況の確認と当日の役割分担について準備することを表にしてください。担当・期限が資料にない場合は「要確認」にしてください。実際の申込人数は教材にないため、数字を作らない const $=s=>document.querySelector(s),total=DATA.slides.length,modal=$('#modal');
let current=0,roleKey='hr',toastTimer;
const RES=new Map(DATA.resources.map(r=>[r.id,r]));
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function button(parent,label,fn,cls='wide'){const b=el('button',label,cls);b.onclick=fn;parent.append(b);return b;}
function external(parent,label,url,cls='action'){const a=el('a',label,cls);a.href=url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a);return a;}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',4500);}
function showModal(title,text,actions=[]){$('#modal-title').textContent=title;$('#modal-body').replaceChildren(el('pre',text));$('#modal-foot').replaceChildren();actions.forEach(a=>button($('#modal-foot'),a.label,a.fn,a.primary?'primary':''));if(!modal.open)modal.showModal();$('#modal-body').scrollTop=0;}
function manualCopy(text){showModal('文章を選択してコピー','Macは Command+C、Windowsは Ctrl+C でコピーしてください。');const area=el('textarea');area.value=text;area.setAttribute('aria-label','手動コピー用の文章');$('#modal-body').append(area);area.focus();area.select();}
async function copyText(text){let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}if(!ok){const area=el('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';(modal.open?$('#modal-body'):document.body).append(area);area.select();try{ok=document.execCommand('copy');}catch(e){}area.remove();}if(ok)toast('コピーしました。Claudeやメモ欄に貼り付けて使えます。');else manualCopy(text);}
function download(name,text){const url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));const a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function openResource(id){const r=RES.get(id);if(!r)return;showModal(r.id+'｜'+r.title,r.text,[{label:'本文をコピー',fn:()=>copyText(r.text),primary:true},{label:'TXTを保存',fn:()=>download(r.filename,r.text)},{label:'手動コピー',fn:()=>manualCopy(r.text)},{label:'教材一覧へ',fn:resources}]);if(['mail','calendar','document','bundle'].includes(r.kind))$('#modal-body').prepend(el('span','研修用の架空データ｜この画面内で開いています','resource-label'));}
function activeKey(){const s=DATA.slides[current];return s.role?roleKey:s.prompt;}
function bundledPrompt(key){const p=DATA.prompts[key];let text=p.text;if(p.resources.length)text+='\n\n【今回使う教材】\n\n'+p.resources.map(id=>RES.get(id).text).join('\n\n────────────\n\n');return text;}
function viewPrompt(key){const p=DATA.prompts[key];showModal(p.title,p.text,[{label:'依頼文をコピー',fn:()=>copyText(p.text),primary:true},{label:'手動コピー',fn:()=>manualCopy(p.text)},...(p.resources.length?[{label:'教材＋依頼文をコピー',fn:()=>copyText(bundledPrompt(key))}]:[])]);}
function renderSlide(s){const target=$('#slide');target.replaceChildren();target.className='slide '+s.kind;target.append(el('p','初級編 第2回　/　Google Workspace × Claude','kicker'));const h=el('h2');h.id='slide-title';s.title.split('\n').forEach((line,i)=>{if(i)h.append(document.createElement('br'));h.append(document.createTextNode(line));});target.append(h);if(s.lead)target.append(el('p',s.lead,'lead'));
 if(s.rows){if(s.kind==='table'){const table=el('table');const body=el('tbody');for(const row of s.rows){const tr=el('tr');row.forEach((t,i)=>{const c=el(i===0?'th':'td',t);if(i===0)c.scope='row';tr.append(c)});body.append(tr)}table.append(body);target.append(table)}else{const rows=el('div',undefined,'rows');for(const [label,text] of s.rows){const row=el('div',undefined,'row');row.append(el('div',label,'label'),el('div',text));rows.append(row)}target.append(rows)}}
 if(s.items){const list=el('ol',undefined,'questions');s.items.forEach(t=>list.append(el('li',t)));target.append(list)}
 if(s.kind==='sources'){const list=el('ul',undefined,'source-links');DATA.sources.forEach(r=>{const li=el('li');external(li,r.title,r.url,'');list.append(li)});target.append(list)}
 if(s.foot)target.append(el('p',s.foot,'foot'));
 const folio=el('div',undefined,'folio');folio.append(el('span','AIブーストカレッジ　初級編 第2回'),el('span',String(current+1).padStart(2,'0')));target.append(folio);
}
function renderPanel(){const s=DATA.slides[current],p=$('#panel');p.replaceChildren();const has=s.resources?.length||s.prompt||s.answer||s.links?.length;p.hidden=!has;if(!has)return;
 p.append(el('div',s.prompt==='live'?'Google Driveで実参照':'教材をクリックして開く','eyebrow'),el('h3',s.prompt==='live'?'接続して、原文を確かめる':s.prompt?'このページで使う教材':'教材と操作'));
 if(s.resources?.length){s.resources.forEach(id=>button(p,RES.get(id).title+'を開く',()=>openResource(id)));}
 if(s.role){const label=el('label','担当する役割');label.htmlFor='role-select';p.append(label);const select=el('select');select.id='role-select';select.setAttribute('aria-label','担当する役割');[['hr','人事'],['recruit','採用'],['pr','社内広報'],['manager','責任者']].forEach(([key,title])=>{const o=el('option',title);o.value=key;select.append(o)});select.value=roleKey;select.onchange=()=>{roleKey=select.value;renderPanel()};p.append(select)}
 if(s.prompt){button(p,'依頼文を見る',()=>viewPrompt(activeKey()));button(p,'依頼文をコピー',()=>copyText(DATA.prompts[activeKey()].text),'primary wide');if(DATA.prompts[activeKey()].resources.length)button(p,'教材＋依頼文をコピー',()=>copyText(bundledPrompt(activeKey())));if(s.prompt!=='live')p.append(el('p',s.prompt==='check'?'会議前メモを作った同じClaudeの会話で続けます。':'最初から試すときは、教材と依頼文をまとめてコピーできます。','tip'));}
 if(s.links?.length){p.append(el('hr'));for(const [label,url] of s.links)external(p,label,url);}
 if(s.prompt){p.append(el('hr'));external(p,'Claudeを開く（新しい会話）','https://claude.ai/new');p.append(el('p',s.prompt==='live'?'教材を自分のGoogle文書へ貼り付け、依頼文のURL欄をその文書のURLに置き換えます。':'続きの依頼は、すでに開いているClaudeの会話へ戻って貼り付けてください。','tip'));}
 if(s.answer)button(p,s.answer==='A03'?'クイズの答えを見る':'模範例を見る',()=>openResource(s.answer),'textlink');
}
function go(index,updateHash=true){current=Math.max(0,Math.min(total-1,Number.isFinite(index)?index:0));const s=DATA.slides[current];renderSlide(s);renderPanel();$('#count').textContent=`${current+1} / ${total}`;$('#select').value=String(current);$('#time').textContent=s.time;$('#prev').disabled=current===0;$('#next').disabled=current===total-1;$('#progress').style.width=((current+1)/total*100)+'%';$('#caption').textContent=$('#panel').hidden?'「次へ」またはキーボードの → で進みます。':'教材は右側のボタンから開けます。スマホではスライドの下に表示されます。';if(updateHash)history.replaceState(null,'','#page='+(current+1));document.title=`${current+1}/${total} ${s.title.replaceAll('\n',' ')}｜11月13日研修`;}
function resources(){showModal('教材一覧','');const body=$('#modal-body');body.replaceChildren(el('p','「開く」を押すと本文がすぐ表示されます。教材はすべてこのHTMLに入っています。','notice'));const zip=el('a','資料・教材をまとめて保存（ZIP）','action');zip.href='training-kit.zip';zip.download='第2回_参加者用研修セット.zip';if(location.protocol!=='file:')body.append(zip);DATA.resources.forEach(r=>{const row=el('div',undefined,'resource-item');row.append(el('span',r.id+'｜'+r.title));button(row,'開く',()=>openResource(r.id),'');button(row,'TXT保存',()=>download(r.filename,r.text),'');body.append(row)});}
function help(){showModal('紙芝居形式で研修を進める','');const b=$('#modal-body');b.replaceChildren();const list=el('ol',undefined,'help-text');['「次へ」「前へ」または左右矢印で進みます。下部の一覧からページも選べます。','「デモへ」は12ページ、「演習へ」は19ページに移動します。','右側の教材ボタンを押すと、原文がこの画面内ですぐ開きます。スマホでは操作欄がスライドの下にあります。','「教材＋依頼文をコピー」して、Claudeへ貼り付けます。続きの依頼は同じ会話で行います。','ファイルを添付する場合は、教材を開いて「TXTを保存」。Claudeの添付ボタンで保存したファイルを選びます。','「模範例」は学習用の例です。AIの実際の回答とは異なる場合があります。','24ページでは教材を自分のGoogle文書にコピーして、Driveとの連携を試せます。GoogleのログインとClaudeのDrive接続が必要です。','コピーできない場合は「手動コピー」で文章を選び、MacはCommand+C、WindowsはCtrl+Cを押します。'].forEach(t=>list.append(el('li',t)));b.append(list,el('p','教材表示・保存・スライド操作はオフラインでも使えます。ClaudeとGoogleの利用にはインターネット接続が必要です。資料の自動添付・自動送信は行いません。','notice'));}
DATA.slides.forEach((s,i)=>{const o=el('option',`${String(i+1).padStart(2,'0')}　${s.title.replaceAll('\n',' ')}`);o.value=String(i);$('#select').append(o)});
$('#next').onclick=()=>go(current+1);$('#prev').onclick=()=>go(current-1);$('#select').onchange=e=>go(Number(e.target.value));$('#jump-demo').onclick=()=>go(DATA.demoPage-1);$('#jump-exercise').onclick=()=>go(DATA.exercisePage-1);$('#resources').onclick=resources;$('#help').onclick=help;
$('#close-modal').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('ブラウザの全画面表示をご利用ください。');}catch(e){toast('ブラウザの全画面表示をご利用ください。');}};
document.addEventListener('keydown',e=>{if(modal.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(total-1)}});
function hashPage(){const m=location.hash.match(/^#page=(\d+)$/);return m?Number(m[1])-1:0;}
window.addEventListener('hashchange',()=>go(hashPage(),false));go(hashPage());
</script>

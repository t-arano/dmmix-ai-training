, "time": "補足・参照", "minutes": 0, "answer": null}, {"title": "参照先と、教材の使い方", "graphic": "\u003cdiv class=\"source-board\">\u003cdiv>\u003cspan>01\u003c/span>\u003cp>プロジェクトの基本\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003cp>作成・資料・指示・共有\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003cp>スキルの有効化と利用\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003cdiv>\u003cspan>04\u003c/span>\u003cp>カスタムスキルの構造\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"bubble yellow\">本文・依頼文は教材ボタンから。公式情報は右側のリンクへ。\u003c/div>", "graphicKind": "board", "kind": "graphic", "foot": "公式情報の確認日：2026年11月25日。操作や利用条件は変更される場合があります。", "resources": ["R01"], "refs": ["projects", "setup", "skills", "custom"], "time": "補足・参照", "minutes": 0, "answer": null}], "resources": [{"id": "K01", "title": "研修用の共通ルール", "text": "【研修用の架空ルール】社内・採用向けの案内文作成／版：2026-11-27 v1\n実在の会社の規程ではありません。\n\n1. 読者に合わせた丁寧な日本語を使う。見出しと短い段落で整理する。\n2. 本文は原則200〜300字程度。今回の依頼で字数指定があるときはそちらを優先する。\n3. 件名、日時、開催方法、必要な行動が分かる文章にする。\n4. 本番日時・掲載日、原稿を確認する期限、申込期限を区別する。\n5. URL、参加必須、録画、写真の掲載許可、担当者名、参加者の感想を推測で加えない。\n6. 未定の情報は【確認中】とし、要確認事項へ分ける。\n7. 古い資料と新しい資料で内容が違うときは、対象の案件と版を確認する。都合よく統合しない。\n8. 作るのは下書き。送信・社内掲載・外部公開の前に担当者が確認する。\n9. この研修では、本物の応募者情報、従業員情報、給与、評価データを入力しない。", "kind": "guide", "filename": "K01_研修用の共通ルール.txt"}, {"id": "I01", "title": "プロジェクトに登録する指示", "text": "あなたは研修用の案内文作成を補助します。\nこのプロジェクトの共通資料「K01_研修用の共通ルール」を参照してください。\n今回の案件の事実は、その依頼で渡した案件資料から確認してください。\n本番・掲載日時、原稿確認期限、申込期限を分けて扱ってください。\n情報に矛盾がある場合は明記し、不明な事実を補わないでください。\n日本語で読みやすい下書きを作り、未確定事項と根拠を添えてください。\n送信や公開は行わず、担当者の確認に回してください。\n過去の会話や記憶があっても、案件の根拠を省略しないでください。", "kind": "guide", "filename": "I01_プロジェクトに登録する指示.txt"}, {"id": "T01", "title": "練習案件① 人事", "text": "【研修用の架空データ】\n資料名：T01_人事案内／版：2026-11-27 v1\n案件ID：HR-001\n担当業務：人事\n読者：入社予定者\n依頼：入社手続き説明会の案内文を作りたい。\n本番日時：2026年12月3日（木）14:00〜14:30\n開催方法：オンライン\n原稿確認期限：2026年12月1日（火）17:00\n申込期限：記載なし\n確定事項：手続きの流れと準備物を説明する。案内文は200〜300字程度。\n未確定事項：参加URL、具体的な準備物、参加必須か任意か、録画配布の有無。\n注意：準備物の内容は、分かっているように書かない。", "kind": "case", "filename": "T01_練習案件① 人事.txt"}, {"id": "T02", "title": "練習案件② 採用", "text": "【研修用の架空データ】\n資料名：T02_採用案内／版：2026-11-27 v1\n案件ID：RC-002\n担当業務：採用\n読者：採用説明会への参加を検討している方\n依頼：採用説明会の告知文を作りたい。\n本番日時：2026年12月10日（木）15:00〜15:45\n開催方法：オンライン\n定員：20名\n原稿確認期限：2026年12月4日（金）12:00\n申込期限：2026年12月8日（火）17:00\n確定事項：業務内容の紹介と質疑応答を行う。案内文は200〜300字程度。\n未確定事項：申込URL、当日の担当者、録画の有無。\n注意：参加による選考優遇は決まっていない。応募者の個人情報は含めない。", "kind": "case", "filename": "T02_練習案件② 採用.txt"}, {"id": "T03", "title": "練習案件③ 社内広報", "text": "【研修用の架空データ】\n資料名：T03_社内広報／版：2026-11-27 v1\n案件ID：PR-003\n担当業務：社内広報\n読者：社員\n依頼：研修実施レポートの社内掲載文を作りたい。\n掲載予定日：2026年12月14日（月）\n研修実施日：2026年11月27日（金）\n原稿確認期限：2026年12月11日（金）17:00\n申込期限：記載なし\n確定事項：プロジェクトへの資料・指示の登録と、案内文作成手順の再利用をテーマにした研修。原稿は300字程度。\n未確定事項：参加人数、写真の掲載許可、参加者の感想。\n注意：この案件は研修後を想定した架空の練習。実際の参加人数や成果を表すものではない。参加者の発言を創作しない。", "kind": "case", "filename": "T03_練習案件③ 社内広報.txt"}, {"id": "P01", "title": "案内文を作る依頼文", "text": "今回の案件資料を使って、案内文の下書きを作ってください。\nプロジェクトに登録した共通ルールを参照してください。\n「案件整理」「案内文の下書き」「要確認事項」「根拠つきの確認表」の順で出してください。\n本番・掲載日時、原稿確認期限、申込期限を混ぜないでください。\n資料にない情報は補わず、下書きのまま提示してください。\n\n【ここに今回のT01・T02・T03のいずれか1件を貼り付ける】", "kind": "guide", "filename": "P01_案内文を作る依頼文.txt"}, {"id": "P02", "title": "スキルを指定する依頼文", "text": "training-notice-drafter スキルを使って、今回の案件の案内文を作ってください。\nプロジェクトの共通ルールと、今回の案件資料を使ってください。\n案件整理、案内文の下書き、要確認事項、根拠つきの確認表を出してください。\n前の案件の日時・URLを流用せず、送信や公開はしないでください。\n\n【ここに今回のT01・T02・T03のいずれか1件を貼り付ける】", "kind": "guide", "filename": "P02_スキルを指定する依頼文.txt"}, {"id": "S01", "title": "配布スキルの中身", "text": "---\nname: training-notice-drafter\ndescription: 研修用の人事・採用・社内広報の案内文を作るときに使う。渡された案件の事実を整理し、下書き、要確認事項、確認表を作成する。\n---\n\n# 研修用・案内文作成\n\n## 適用する場面\n人事、採用、社内広報の案内文・告知文・掲載文の下書きを求められたときに使う。\n採用可否の判断、人物評価、従業員の評価は行わない。\n\n## 作業の手順\n1. 今回の依頼に添付・貼り付けられた案件を特定する。複数なら対象を確認する。\n2. 案件ID、担当業務、読者、本番・掲載日時、原稿確認期限、申込期限、形式、確定事項、未確定事項を分ける。\n3. プロジェクト内の共通ルールを確認する。案件の事実は今回の案件資料を根拠にし、以前の案件から日時やURLを流用しない。矛盾する情報は勝手に決めず、要確認として示す。\n4. 読者に合う案内文を作る。入力にないURL、担当者、許可、感想、参加義務、実績は補わない。未確定情報は【確認中】と記す。共有・送信・公開は行わない。\n5. 数字・日時・固有名詞を元の資料と照らす。指示がないときは案内本文を200〜300字程度とし、依頼に指定があれば従う。\n\n## 出力の順序\n【案件整理】案件ID、読者、本番・掲載日時、原稿確認期限、申込期限。未記載は「記載なし」。\n【案内文の下書き】件名と本文。下書きであることを明示する。\n【要確認事項】未確定項目、情報の矛盾、公開前に人が確認すること。\n【確認表】確認項目／根拠となる資料名と記述／判定（確認できる・未確定・不一致）。\n\n## 最後の確認\n「下書きです。送信・公開の前に担当者が確認してください」と添える。\nスキルを使ったかどうかは実際の読み込み表示・作業履歴で確認する。出力の形が似ているだけで使用済みと断定しない。", "kind": "guide", "filename": "S01_配布スキルの中身.txt", "links": [["スキルZIPを保存", "training-notice-drafter.zip"]]}, {"id": "G01", "title": "プロジェクトの操作手順", "text": "【パソコンのブラウザで操作】\n1. Claudeにログインし、「プロジェクト／Projects」を開く。\n2. 新規作成を選ぶ。名前は「研修1127_案内文作成」。\n3. 共有設定を確認し、研修中は自分用の非公開範囲にする。\n4. この資料のK01を開き、「TXTを保存」で保存する。\n5. プロジェクトの資料追加からK01をアップロードする。資料名が一覧にあるか確認する。\n6. I01を開き、「本文をコピー」。プロジェクトの指示欄へ貼り付け、保存する。\n7. プロジェクト内で会話を開始する。P01とT01を貼り付けて依頼する。\n8. A01とC01を開き、出力を元の案件資料と比べる。\n\n【画面が違うとき】\n2026年11月25日確認の公式情報では、新しいProjectsも一部アカウントに順次提供されています。\n従来画面は「Project knowledge／知識」「Set project instructions／指示」、新しい画面は「Library／資料」「Instructions／指示」などの名称を手掛かりにします。\n見つからない場合は講師の画面で確認。プロジェクトを使えない場合はG03で同じ考え方を練習します。\n\n【メモリとの違い】\n会話の記憶の利用はプランや設定により異なります。共有すべき基準や根拠は、会話の記憶だけに頼らず資料と指示として登録します。", "kind": "guide", "filename": "G01_プロジェクトの操作手順.txt"}, {"id": "G02", "title": "スキルの登録と確認手順", "text": "1. まず「配布スキルの中身」を読み、案内文作成の手順であることを確認する。\n2. 「スキルZIPを保存」から training-notice-drafter.zip を保存する。登録にはこのZIPを使い、研修一式のZIPと取り違えない。\n3. Claudeの「Customize／カスタマイズ」→「Skills／スキル」を開く。\n4. 「＋」「Create skill」「Upload a skill」など、スキルを追加・アップロードする項目を選ぶ。\n5. training-notice-drafter.zip をアップロードし、一覧に表示されたらONにする。\n6. プロジェクト内の会話へ戻り、P02とT01を貼り付けて実行する。\n7. スキルを読み込んだ表示や作業履歴を開ける場合は、training-notice-drafter が使われたか確認する。\n8. 出力をC01で点検する。出力形式が似ているだけで「スキルが動いた」と断定しない。\n9. 別の案件T02またはT03で再利用し、日付・相手・未確定事項が切り替わるか確認する。\n\n【利用条件】\n公式情報ではスキルには「コード実行とファイル作成」が必要です。新しい設定画面では「Create and edit files」と表示される場合があります。\n組織アカウントで設定が無効の場合、管理者へ確認し、研修中はG03を使います。勝手に組織の制限を変更しません。\n本スキルは文章の手順だけで、実行用プログラムを含みません。\n\n【確認できない場合】\nON、スキル名、今回の依頼内容を順に確認。使用表示が見つからない場合は「使用確認できず」とW01に記録します。\n本教材の完成見本は講師が用意した例であり、あなたのアカウントでスキルが動いた証明ではありません。", "kind": "guide", "filename": "G02_スキルの登録と確認手順.txt", "links": [["スキルZIPを保存", "training-notice-drafter.zip"], ["Claudeを開く", "https://claude.ai/"]]}, {"id": "G03", "title": "機能を使えない場合の代替手順", "text": "プロジェクトやスキルを使えない場合も、資料・ルール・手順の役割を練習します。\n\n1. 通常のClaudeチャットにK01（共通ルール）とI01（指示）を貼り付ける。\n2. S01の「作業の手順」と「出力の順序」を貼り付ける。\n3. T01・T02・T03から1つ選び、案件を貼り付ける。\n4. 「この資料と手順で案内文の下書きを作って」と依頼する。\n5. C01で照合し、W01の実施方法に「通常チャットで手順を貼り付け」と記録する。\n\nこれはプロジェクトの登録やスキルのインストール・動作確認とは異なる練習です。\nClaude自体を使えないときは、T01とA01を比較し、確認表と業務設計のワークを行います。", "kind": "guide", "filename": "G03_機能を使えない場合の代替手順.txt"}, {"id": "A01", "title": "人事案件の完成見本", "text": "【講師が用意した学習用の例】実際のAI実行結果ではありません。\n完全に同じ文章にする必要はありません。元の資料と事実が合っているかを確認します。\n\n【案件整理】\n案件ID：HR-001／読者：入社予定者\n本番：2026年12月3日（木）14:00〜14:30／オンライン\n原稿確認期限：2026年12月1日（火）17:00\n申込期限：記載なし\n\n【案内文の下書き】\n件名：入社手続き説明会のご案内（12月3日）\n入社予定の皆さまへ\n入社手続きの流れと準備物をご案内するオンライン説明会を、2026年12月3日（木）14:00〜14:30に開催します。手続きを進める際の流れや、準備に関する内容をご説明する予定です。開催日時をご確認ください。\n参加URL、具体的な準備物、参加が必須か任意か、録画配布の有無は、現在【確認中】です。確定していない内容を含むため、この文章は確認用の下書きです。各項目を確認のうえ、正式な案内文を整えます。\n\n【要確認事項】\n参加URL／具体的な準備物／参加必須・任意／録画配布\n原稿確認期限は社内作業の期限なので、参加者向け本文の参加期限として書かない。\n\n【確認表】\n本番日時：T01の「本番日時」と一致。\n確認期限：T01の「原稿確認期限」と一致。本文の参加期限に転用していない。\nURL：T01で未確定。創作していない。\n参加義務：T01で未確定。「全員必須」としていない。\n\n下書きです。送信・公開の前に担当者が確認してください。", "kind": "guide", "filename": "A01_人事案件の完成見本.txt"}, {"id": "A02", "title": "採用・広報案件の確認見本", "text": "【講師用の照合ポイント】実際のAI実行結果ではありません。\n\nT02 採用\n案件ID：RC-002\n本番：12月10日（木）15:00〜15:45、オンライン、定員20名\n原稿確認：12月4日（金）12:00\n申込：12月8日（火）17:00\n未確定：申込URL、当日の担当者、録画\n以前の人事案件の12月3日や、12月1日の期限が混ざっていないこと。\n「選考に有利」「採用確約」など、資料にない案内が加わっていないこと。\n\nT03 社内広報\n案件ID：PR-003\n掲載予定：12月14日（月）\n研修実施：11月27日（金）\n原稿確認：12月11日（金）17:00\n未確定：参加人数、写真掲載許可、参加者の感想\n実施日と掲載日が混ざっていないこと。\n「参加者から好評だった」「満足度○％」など、資料にない実績や感想を作っていないこと。\n写真掲載を許可済みとして扱っていないこと。\n\n日付はいずれも2026年。これは研修用の架空案件です。", "kind": "guide", "filename": "A02_採用・広報案件の確認見本.txt"}, {"id": "C01", "title": "結果の確認表", "text": "案件ID：\n実施方法：プロジェクト＋スキル／プロジェクトのみ／通常チャット／見本照合\n\n□ 今回の読者・担当業務になっている\n□ 本番・掲載日時が元資料と一致している\n□ 原稿確認期限と申込期限を区別している\n□ 前の案件の日時・URL・条件が混ざっていない\n□ 未定のURL・義務・許可・感想を創作していない\n□ 下書き、要確認事項、根拠つき確認表がある\n□ 根拠として挙げた資料名・記述が実際に存在する\n□ 送信・公開の前に人が確認する状態になっている\n\nスキルの確認：読み込み確認できた／確認できず／未使用\n※きれいな文章でも根拠が合わなければ修正します。\n※この確認表は文章作成の練習用で、採用・人事評価の判断には使いません。", "kind": "guide", "filename": "C01_結果の確認表.txt"}, {"id": "W01", "title": "実習ワークシート", "text": "【実習の記録】\n選んだ業務：人事／採用／社内広報／責任者レビュー\n選んだ案件ID：\nプロジェクト名：\n登録した共通資料と版：\n共通の指示：保存済み／未実施\n実施方法：プロジェクト＋スキル／プロジェクトのみ／通常チャット／見本照合\nスキル使用の確認：確認できた／確認できず／未使用\n1件目のチェック結果：\n2件目に変えた資料と、変わった出力：\n修正した箇所：\n\n【自分の業務へ】\n繰り返している作業を1つ：\n毎回共通の資料・ルール：\n案件ごとに変える情報：\n繰り返す作業手順：\n最後に確認する人：\n社内で事前確認する利用範囲：\n次に試す小さな作業：", "kind": "guide", "filename": "W01_実習ワークシート.txt"}, {"id": "Q01", "title": "振り返りクイズの答え", "text": "Q1：毎回共通の文章ルールはどこに置く？\nA：プロジェクトの資料・指示。会話の記憶だけに頼らない。\n\nQ2：案件ごとに変わる本番日時は？\nA：今回の案件資料で渡す。古い案件の情報を流用しない。\n\nQ3：繰り返す案内文作成の手順は？\nA：スキルとして再利用できる。設定・有効化・実行の確認が必要。\n\nQ4：文章がきれいなら、そのまま送ってよい？\nA：元資料の日時・期限・未確定事項・根拠を人が確認してから使う。\n\nQ5：スキルの手順をチャットに貼ったら、インストール済みと言える？\nA：言えない。通常チャットで手順を渡した練習として記録する。", "kind": "guide", "filename": "Q01_振り返りクイズの答え.txt"}, {"id": "R01", "title": "公式情報と画面が違うとき", "text": "公式情報の確認日：2026年11月25日\n研修対象：Claudeのプロジェクトとカスタムスキル。\n新しいProjectsは一部アカウントへ順次提供中。画面の名称・位置が異なる場合があります。\n操作は「資料」「指示」「今回の依頼」「スキル」の役割を手掛かりに進めます。\n\nプロジェクトの基本・新旧画面\nhttps://support.claude.com/en/articles/9517075-what-are-projects\nプロジェクトの作成・資料・指示・共有\nhttps://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects\nスキルの有効化・追加・利用\nhttps://support.claude.com/en/articles/12512180-use-skills-in-claude\nカスタムスキルの構造と確認\nhttps://support.claude.com/en/articles/12512198-how-to-create-custom-skills\n\n共有はプランと組織の管理設定に従います。この研修では各自の練習用プロジェクトを使用します。\n記憶機能の利用は設定により異なるため、業務の根拠は資料として確認します。", "kind": "guide", "filename": "R01_公式情報と画面が違うとき.txt"}], "prompts": {}, "sources": [{"id": "projects", "title": "Claude公式：プロジェクトの基本と新旧画面", "url": "https://support.claude.com/en/articles/9517075-what-are-projects"}, {"id": "setup", "title": "Claude公式：作成・資料・指示・共有", "url": "https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects"}, {"id": "skills", "title": "Claude公式：スキルの有効化・追加・利用", "url": "https://support.claude.com/en/articles/12512180-use-skills-in-claude"}, {"id": "custom", "title": "Claude公式：カスタムスキルの構造と確認", "url": "https://support.claude.com/en/articles/12512198-how-to-create-custom-skills"}], "demoPage": 9, "exercisePage": 20, "demoLinks": [["Claudeを開く", "https://claude.ai/"], ["プロジェクトを開く", "https://claude.ai/projects"], ["スキルZIPを保存", "training-notice-drafter.zip"]]};
const $=s=>document.querySelector(s),total=DATA.slides.length,modal=$('#modal');
let current=0,roleKey='hr',toastTimer;
const RES=new Map(DATA.resources.map(r=>[r.id,r]));
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function button(parent,label,fn,cls='wide'){const b=el('button',label,cls);b.onclick=fn;parent.append(b);return b;}
function external(parent,label,url,cls='action'){const a=el('a',label,cls);a.href=url;if(/\.zip$/.test(url)){a.download=url.split('/').pop();}else{a.target='_blank';a.rel='noopener noreferrer';}parent.append(a);return a;}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',4500);}
function showModal(title,text,actions=[]){$('#modal-title').textContent=title;$('#modal-body').replaceChildren(el('pre',text));$('#modal-foot').replaceChildren();actions.forEach(a=>button($('#modal-foot'),a.label,a.fn,a.primary?'primary':''));if(!modal.open)modal.showModal();$('#modal-body').scrollTop=0;}
function manualCopy(text){showModal('文章を選択してコピー','Macは Command+C、Windowsは Ctrl+C でコピーしてください。');const area=el('textarea');area.value=text;area.setAttribute('aria-label','手動コピー用の文章');$('#modal-body').append(area);area.focus();area.select();}
async function copyText(text){let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}if(!ok){const area=el('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';(modal.open?$('#modal-body'):document.body).append(area);area.select();try{ok=document.execCommand('copy');}catch(e){}area.remove();}if(ok)toast('コピーしました。Claudeやメモ欄に貼り付けて使えます。');else manualCopy(text);}
function download(name,text){const url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));const a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function openResource(id){const r=RES.get(id);if(!r)return;showModal(r.id+'｜'+r.title,r.text,[{label:'本文をコピー',fn:()=>copyText(r.text),primary:true},{label:'TXTを保存',fn:()=>download(r.filename,r.text)},{label:'手動コピー',fn:()=>manualCopy(r.text)},{label:'教材一覧へ',fn:resources}]);if(r.links){const links=el('div',undefined,'live-links');for(const [label,url] of r.links)external(links,label,url);$('#modal-body').prepend(links);}if(['case'].includes(r.kind))$('#modal-body').prepend(el('span','研修用の架空データ｜この画面内で開いています','resource-label'));}
function activeKey(){const s=DATA.slides[current];return s.role?roleKey:s.prompt;}
function bundledPrompt(key){const p=DATA.prompts[key];let text=p.text;if(p.resources.length)text+='\n\n【今回使う教材】\n\n'+p.resources.map(id=>RES.get(id).text).join('\n\n────────────\n\n');return text;}
function viewPrompt(key){const p=DATA.prompts[key];showModal(p.title,p.text,[{label:'依頼文をコピー',fn:()=>copyText(p.text),primary:true},{label:'手動コピー',fn:()=>manualCopy(p.text)},...(p.resources.length?[{label:'教材＋依頼文をコピー',fn:()=>copyText(bundledPrompt(key))}]:[])]);}
function renderGraphicSlide(s){
 const target=$('#slide');target.replaceChildren();target.className='slide gragreco '+s.graphicKind;
 target.append(el('p','Claude　/　プロジェクトとスキル','kicker'));
 const h=el('h2');h.id='slide-title';s.title.split('\n').forEach((line,i)=>{if(i)h.append(document.createElement('br'));h.append(document.createTextNode(line));});target.append(h);
 const content=el('div',undefined,'graphic-body');content.innerHTML=s.graphic;target.append(content);
 if(s.foot)target.append(el('p',s.foot,'foot'));
 const folio=el('div',undefined,'folio');folio.append(el('span','AIブーストカレッジ　2026年11月27日'),el('span',String(current+1).padStart(2,'0')));target.append(folio);
}
function renderSlide(s){if(s.graphic){renderGraphicSlide(s);return;}const target=$('#slide');target.replaceChildren();target.className='slide '+s.kind;target.append(el('p','Workspace Studio　/　Forms・Gemini・Sheets・Docs','kicker'));const h=el('h2');h.id='slide-title';s.title.split('\n').forEach((line,i)=>{if(i)h.append(document.createElement('br'));h.append(document.createTextNode(line));});target.append(h);if(s.lead)target.append(el('p',s.lead,'lead'));
 if(s.rows){if(s.kind==='table'){const table=el('table');const body=el('tbody');for(const row of s.rows){const tr=el('tr');row.forEach((t,i)=>{const c=el(i===0?'th':'td',t);if(i===0)c.scope='row';tr.append(c)});body.append(tr)}table.append(body);target.append(table)}else{const rows=el('div',undefined,'rows');for(const [label,text] of s.rows){const row=el('div',undefined,'row');row.append(el('div',label,'label'),el('div',text));rows.append(row)}target.append(rows)}}
 if(s.items){const list=el('ol',undefined,'questions');s.items.forEach(t=>list.append(el('li',t)));target.append(list)}
 if(s.kind==='sources'){const list=el('ul',undefined,'source-links');DATA.sources.filter(r=>!s.refs||s.refs.includes(r.id)).forEach(r=>{const li=el('li');external(li,r.title,r.url,'');list.append(li)});target.append(list)}
 if(s.foot)target.append(el('p',s.foot,'foot'));
 const folio=el('div',undefined,'folio');folio.append(el('span','AIブーストカレッジ　2026年11月27日'),el('span',String(current+1).padStart(2,'0')));target.append(folio);
}
function renderPanel(){const s=DATA.slides[current],p=$('#panel');p.replaceChildren();p.hidden=!(s.resources?.length||s.prompt||s.answer||s.links?.length||s.refs?.length);if(p.hidden)return;
p.append(el('div','教材をクリックして開く','eyebrow'),el('h3','このページの教材と操作'));
for(const id of s.resources||[])button(p,RES.get(id).title+'を開く',()=>openResource(id));
if(s.prompt){button(p,'依頼文を見る',()=>viewPrompt(s.prompt));button(p,'依頼文をコピー',()=>copyText(DATA.prompts[s.prompt].text),'primary wide');p.append(el('p','Claudeの会話欄へ貼り付けます。','tip'));}
if(s.links?.length){p.append(el('hr'));for(const [label,url] of s.links)external(p,label,url);}
if(s.answer)button(p,s.answer==='Q01'?'クイズの答えを見る':'完成見本を見る',()=>openResource(s.answer),'textlink');
if(s.refs?.length){p.append(el('hr'));for(const id of s.refs){const ref=DATA.sources.find(x=>x.id===id);external(p,ref.title,ref.url,'source-action');}}
}
function go(index,updateHash=true){current=Math.max(0,Math.min(total-1,Number.isFinite(index)?index:0));const s=DATA.slides[current];renderSlide(s);renderPanel();$('#count').textContent=`${current+1} / ${total}`;$('#select').value=String(current);$('#time').textContent=s.time;$('#prev').disabled=current===0;$('#next').disabled=current===total-1;$('#progress').style.width=((current+1)/total*100)+'%';$('#caption').textContent=$('#panel').hidden?'「次へ」またはキーボードの → で進みます。':'教材は右側のボタンから開けます。スマホではスライドの下に表示されます。';if(updateHash)history.replaceState(null,'','#page='+(current+1));document.title=`${current+1}/${total} ${s.title.replaceAll('\n',' ')}｜11月27日研修`;}
function resources(){showModal('教材一覧','');const body=$('#modal-body');body.replaceChildren(el('p','「開く」を押すと本文がすぐ表示されます。教材はすべてこのHTMLに入っています。','notice'));if(location.protocol!=='file:'){const a=el('a','資料・教材をまとめて保存（ZIP）','action');a.href='training-kit.zip';a.download='第4回_プロジェクトとスキル_研修セット.zip';body.append(a);}DATA.resources.forEach(r=>{const row=el('div',undefined,'resource-item');row.append(el('span',r.id+'｜'+r.title));button(row,'開く',()=>openResource(r.id),'');button(row,'TXT保存',()=>download(r.filename,r.text),'');body.append(row)});}
function demoAssets(){showModal('実習を始める','');const b=$('#modal-body');b.replaceChildren(el('p','Claudeは各自のアカウントで操作します。教材はすべて架空の練習用です。','notice'));const links=el('div',undefined,'live-links');for(const [label,url] of DATA.demoLinks)external(links,label,url);b.append(links);button(b,'プロジェクトの操作手順を開く',()=>openResource('G01'));button(b,'スキルの登録と確認手順を開く',()=>openResource('G02'));button(b,'代替手順を開く',()=>openResource('G03'));}
function help(){showModal('この研修資料の使い方','');const b=$('#modal-body');b.replaceChildren();const list=el('ol',undefined,'help-text');['「次へ」「前へ」または左右矢印で進みます。下の一覧からページを選べます。','「デモへ」は9ページ、「演習へ」は20ページへ移動します。本編30ページ＋補足2ページ、60分です。','教材ボタンを押すと、この画面内で本文が開きます。「本文をコピー」「TXTを保存」が使えます。','実習は各自のClaudeで行います。スキル登録には専用の training-notice-drafter.zip を使います。','完成見本は講師が用意した学習用の例です。実際のAI出力や、スキル実行済みの証明ではありません。','コピーできない場合は「手動コピー」を使い、MacはCommand+C、WindowsはCtrl+Cでコピーします。','「研修一覧へ」から、これまでの回も選べます。'].forEach(t=>list.append(el('li',t)));b.append(list);}
DATA.slides.forEach((s,i)=>{const o=el('option',`${String(i+1).padStart(2,'0')}　${s.title.replaceAll('\n',' ')}`);o.value=String(i);$('#select').append(o)});
$('#next').onclick=()=>go(current+1);$('#prev').onclick=()=>go(current-1);$('#select').onchange=e=>go(Number(e.target.value));$('#jump-demo').onclick=()=>go(DATA.demoPage-1);$('#jump-exercise').onclick=()=>go(DATA.exercisePage-1);$('#resources').onclick=resources;$('#demo-assets').onclick=demoAssets;$('#help').onclick=help;
$('#close-modal').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('ブラウザの全画面表示をご利用ください。');}catch(e){toast('ブラウザの全画面表示をご利用ください。');}};
document.addEventListener('keydown',e=>{if(modal.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(total-1)}});
function hashPage(){const m=location.hash.match(/^#page=(\d+)$/);return m?Number(m[1])-1:0;}
window.addEventListener('hashchange',()=>go(hashPage(),false));go(hashPage());
</script>

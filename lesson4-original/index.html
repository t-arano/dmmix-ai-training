ong>\u003cspan>T01・T02、ページの日時と条件\u003c/span>\u003c/div>\u003c/li>\u003cli>\u003cb>2\u003c/b>\u003cdiv>\u003cstrong>実際の成果物\u003c/strong>\u003cspan>保存ファイル、フォームの入力内容\u003c/span>\u003c/div>\u003c/li>\u003cli>\u003cb>3\u003c/b>\u003cdiv>\u003cstrong>作業の続き\u003c/strong>\u003cspan>スマホとPCの同じ会話に残る依頼\u003c/span>\u003c/div>\u003c/li>\u003c/ol>\u003cdiv class=\"bubble yellow\">何をしたかに加えて、どこで確かめたかも記録。\u003c/div>", "graphicKind": "board", "kind": "graphic", "foot": "担当者の下書きと責任者の確認を分け、修正点を具体的に伝えます。", "resources": ["C01", "A01"], "refs": [], "links": [], "time": "14:56–14:58", "minutes": 2, "answer": null}, {"title": "振り返りクイズ", "graphic": "\u003cdiv class=\"quiz-grid\">\u003cdiv>\u003cb>Q1\u003c/b>\u003cp>添付と接続は\u003cbr>どう違う？\u003c/p>\u003c/div>\u003cdiv>\u003cb>Q2\u003c/b>\u003cp>GitHubを読めたら\u003cbr>保存も完了？\u003c/p>\u003c/div>\u003cdiv>\u003cb>Q3\u003c/b>\u003cp>フォームへの入力は\u003cbr>送信と同じ？\u003c/p>\u003c/div>\u003cdiv>\u003cb>Q4\u003c/b>\u003cp>スマホに続きがない\u003cbr>何を確かめる？\u003c/p>\u003c/div>\u003c/div>", "graphicKind": "board", "kind": "graphic", "foot": "答えを開き、自分の言葉で説明できるか確認します。", "resources": [], "refs": [], "links": [], "time": "14:58–14:59", "minutes": 1, "answer": "Q01"}, {"title": "次の仕事で使う場面を決める", "graphic": "\u003cdiv class=\"sk-flow\">\u003cdiv class=\"flow-node violet\">\u003cspan class=\"doodle folder\" aria-hidden=\"true\">\u003c/span>\u003cstrong>対象の資料\u003c/strong>\u003cspan>場所と範囲を選ぶ\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"flow-node orange\">\u003cspan class=\"doodle ai\" aria-hidden=\"true\">\u003c/span>\u003cstrong>使う方法\u003c/strong>\u003cspan>PC・ブラウザ・スマホ\u003c/span>\u003c/div>\u003cspan class=\"arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"flow-node teal\">\u003cspan class=\"doodle person\" aria-hidden=\"true\">\u003c/span>\u003cstrong>結果を確認\u003c/strong>\u003cspan>保存先と中身を見る\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"bubble yellow\">W01に「次に試す業務」と「確認する人」を残す。\u003c/div>", "graphicKind": "board", "kind": "graphic", "foot": "当初の第4回の4項目を学び、個別の業務研修へつなげます。", "resources": ["W01"], "refs": [], "links": [], "time": "14:59–15:00", "minutes": 1, "answer": null}, {"title": "補足：機能を使えないとき", "graphic": "\u003cdiv class=\"mapping\">\u003cdiv>\u003cb class=\"map-source violet\">フォルダ接続\u003c/b>\u003ci>→\u003c/i>\u003cp>TXTを添付して、自分で保存する\u003c/p>\u003c/div>\u003cdiv>\u003cb class=\"map-source orange\">GitHub連携\u003c/b>\u003ci>→\u003c/i>\u003cp>人がファイルの本文を渡す\u003c/p>\u003c/div>\u003cdiv>\u003cb class=\"map-source blue\">Chrome拡張\u003c/b>\u003ci>→\u003c/i>\u003cp>ページをコピーし、自分で入力する\u003c/p>\u003c/div>\u003cdiv>\u003cb class=\"map-source teal\">スマホ・音声\u003c/b>\u003ci>→\u003c/i>\u003cp>PCの文字入力で確認メモを作る\u003c/p>\u003c/div>\u003c/div>", "graphicKind": "board", "kind": "graphic", "foot": "利用できる範囲で進め、実際に試した方法を記録します。", "resources": ["R01"], "refs": [], "links": [], "time": "補足・参照", "minutes": 0, "answer": null}, {"title": "参照先と、教材の使い方", "graphic": "\u003cdiv class=\"source-board\">\u003cdiv>\u003cspan>01\u003c/span>\u003cp>ファイルの添付\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003cp>PC・Web・スマホ\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003cp>GitHub連携\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003cdiv>\u003cspan>04\u003c/span>\u003cp>Chrome拡張と音声\u003csmall>Claude公式ヘルプ\u003c/small>\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"bubble yellow\">教材はボタンで開く。詳しい操作は公式情報へ。\u003c/div>", "graphicKind": "board", "kind": "graphic", "foot": "公式情報の確認日：2026年11月27日。画面や利用条件は変更される場合があります。", "resources": ["R01"], "refs": ["upload", "cowork", "start", "github", "chrome", "voice"], "links": [], "time": "補足・参照", "minutes": 0, "answer": null}], "resources": [{"id": "T01", "title": "企画メモ v1", "text": "【研修用の架空データ】採用説明会・企画メモ v1\n作成日：2026年11月20日\n案件ID：RC-1127\n対象：採用説明会への参加を検討している方\n名称：仕事紹介オンライン説明会\n開催日：2026年12月10日（木）\n開催時間：15:00〜15:45\n開催方法：オンライン\n定員：20名\n申込期限：2026年12月8日（火）17:00\n内容：仕事の紹介、1日の流れ、質疑応答\n未確定：申込URL、担当者名、録画配布\n注意：選考優遇や参加必須という条件は決まっていない。", "kind": "case", "filename": "T01_企画メモ v1.txt"}, {"id": "T02", "title": "変更連絡 v2", "text": "【研修用の架空データ】採用説明会・変更連絡 v2\n更新日：2026年11月26日\n案件ID：RC-1127\n対象：T01「採用説明会・企画メモ v1」と同じ説明会\n変更する項目：開始時間を16:00、終了時間を16:45に変更。定員を30名に変更。\n変更しない項目：開催日は2026年12月10日（木）。オンライン開催。申込期限は2026年12月8日（火）17:00。\n内容：仕事の紹介、1日の流れ、質疑応答。\n引き続き未確定：申込URL、担当者名、録画配布。\n原稿確認期限：2026年12月4日（金）12:00。これは社内の確認期限であり、参加者の申込期限ではない。\n以後、この変更連絡を反映した内容を最新として扱う。", "kind": "case", "filename": "T02_変更連絡 v2.txt"}, {"id": "T03", "title": "修正前の案内文", "text": "【研修用の架空データ】修正前の案内文\n※誤りを含む練習用原稿です。\n件名：仕事紹介オンライン説明会のご案内\n12月10日（木）15:00〜15:45にオンライン説明会を開催します。定員は20名です。\n仕事の紹介、1日の流れ、質疑応答を行います。12月4日（金）12:00までにお申し込みください。\n参加者には録画をお送りします。\n申込URL：後ほどご案内します。", "kind": "case", "filename": "T03_修正前の案内文.txt"}, {"id": "P01", "title": "ファイル添付で使う依頼文", "text": "これは研修用の架空案件です。添付したT01、T02、T03を使います。\nT02の変更連絡を優先し、T03の案内文を修正してください。\nまず「変更した箇所／変更後の内容／根拠のファイル名」を表で示し、その後に案内文の下書きを出してください。\n開催日時、定員、申込期限、社内の原稿確認期限を区別してください。\n未確定のURL・担当者名・録画配布を推測しないでください。\n元のファイルは変更せず、送信や公開も行いません。\nファイル作成が使える場合は、修正版を「案内文_修正版.txt」としてダウンロードできるようにしてください。使えない場合は、コピーできる本文を出してください。", "kind": "guide", "filename": "P01_ファイル添付で使う依頼文.txt"}, {"id": "P02", "title": "フォルダ接続で使う依頼文", "text": "研修用フォルダ「研修1127_ファイル実習」だけを対象にしてください。\n1. まず参照するファイルの一覧と、作るファイル・保存先の案を示し、私の確認を待ってください。\n2. 確認後、01_元資料のT01・T02・T03を読み、T02を優先して案内文を修正してください。\n3. 01_元資料は変更・移動・削除せず、02_作業用へ「案内文_修正版.txt」と「変更点一覧.txt」を新規保存してください。同名ファイルがある場合は、上書きせず確認してください。\n4. 開催日時・定員・申込期限・社内の原稿確認期限を区別し、未確定のURL・担当者名・録画配布を推測しないでください。\n5. 保存したファイル名と場所、変更点の根拠を示してください。送信・公開はしません。\nこのフォルダ以外のファイルやアプリを操作する必要はありません。", "kind": "guide", "filename": "P02_フォルダ接続で使う依頼文.txt"}, {"id": "G01", "title": "PCファイル実習の手順", "text": "A：全員で行える、ファイル添付の方法\n1. 「練習用フォルダZIPを保存」を押し、ダウンロードしたZIPを展開します。\n2. 中の「研修1127_ファイル実習」を、デスクトップなど分かる場所へ置きます。\n3. Claudeの新しい会話を開き、＋の「ファイルや写真を追加」等から01_元資料にあるTXTを3点添付します。\n4. P01をコピーして依頼します。出力をA01と照らし合わせます。\n5. 修正版をダウンロードし、02_作業用へ保存します。保存後、そのファイルを開いて本文を確かめます。\n6. ダウンロードできない場合は、本文をテキスト編集アプリへ貼り付けて保存します。Macでは標準テキスト、Windowsではメモ帳が使えます。\n\nB：講師デモまたは利用できる方の、フォルダ接続の方法\n1. Claude Desktopで、ローカルフォルダを選ぶ操作を使い「研修1127_ファイル実習」だけを指定します。画面の名称は提供状況で異なります。\n2. 許可する対象と、読み取り・書き込みの範囲を確認します。会社の制限がある場合はAで進めます。\n3. P02を渡し、参照対象と保存計画を見てから作業を進めます。\n4. 完了メッセージだけで判断せず、PC側の02_作業用を開き、2ファイルの中身を確認します。\n5. 実習後は、不要なフォルダ接続を解除・見直します。\n\n添付は選んだファイルを渡す操作です。元フォルダの変更が自動で添付に反映されるとは限りません。\nフォルダ接続は、許可したPC内の場所へアクセスする操作です。クラウド上の作業からPCのファイルを扱う場合も、接続したPCのDesktopアプリを開いておく必要があります。\n新旧のClaude画面でCoworkの切り替え欄がない場合があります。機能名より「ファイルの追加」「フォルダの選択」で探します。", "kind": "guide", "filename": "G01_PCファイル実習の手順.txt", "links": [["練習用フォルダZIPを保存", "practice-files.zip"], ["Claudeを開く", "https://claude.ai/"]]}, {"id": "G02", "title": "GitHub連携の確認手順", "text": "11月18日のGitHub研修を振り返り、今回は「資料として読む」と「変更して保存する」を分けます。\n\n講師デモ\n1. 教材の「GitHubの練習ファイル」を開き、ファイル名と本文を見る。\n2. GitHub連携を利用できるアカウントでは、Claudeの＋から「Add from GitHub」等を選び、対象のリポジトリとファイルを選ぶ。\n3. 今回は lesson4-original/demo/source-notes.md のみを対象にする。アクセス許可は必要な範囲に限定する。\n4. P03を使い、説明会の最新情報と根拠をまとめる。\n5. 追加した資料の参照と、リポジトリへの変更・保存・公開を区別する。\n\nGitHubの基本連携で取り込むのは、選んだブランチのファイル名・本文です。コミット履歴やPRを丸ごと同期する機能ではありません。\nプロジェクトへ追加した資料は、必要に応じてSyncで最新版を取得します。回答で修正案が出ても、GitHub側へ保存済みとは限りません。\nClaude Code等で変更する場合は、変更内容の確認、コミット、共有先への反映を別々に確認します。\n\n接続できない場合\nGitHubの練習ファイルを人が開き、本文をClaudeに貼り付けて説明を求めます。実施記録には「手動で本文を渡した」と記します。\nURL：https://github.com/t-arano/dmmix-ai-training/blob/main/lesson4-original/demo/source-notes.md", "kind": "guide", "filename": "G02_GitHub連携の確認手順.txt", "links": [["GitHubの練習ファイル", "https://github.com/t-arano/dmmix-ai-training/blob/main/lesson4-original/demo/source-notes.md"]]}, {"id": "P03", "title": "GitHub資料を読む依頼文", "text": "選択した研修用ファイル source-notes.md を読み、次の4点を初心者向けに説明してください。\n1. このファイルは何の資料か。\n2. 開催日・開始終了時刻・定員・申込期限は何か。\n3. まだ決まっていない項目は何か。\n4. 根拠となるファイル名と見出しはどこか。\n資料の参照だけを行い、ファイルの書き換え・コミット・公開はしません。\nアクセスできないときは、読めたように答えず、その旨を伝えてください。", "kind": "guide", "filename": "P03_GitHub資料を読む依頼文.txt"}, {"id": "G03", "title": "ブラウザ実習の手順", "text": "事前準備\nPCのGoogle Chromeと、会社で利用を許可されたClaude in Chromeを使います。導入は公式ヘルプ内のChrome Web Storeリンクから行います。スマホのChromeへ同じ拡張機能を入れる研修ではありません。\n利用には対応プラン・組織設定が必要です。未導入・利用不可の方は、ページ本文をコピーする代替方法で進めます。\n\n実習\n1. 「練習用の説明会ページ」を開きます。\n2. ChromeのClaudeアイコンからサイドパネルを開き、対象が練習ページであることを確認します。\n3. P04の前半を渡し、日時・定員・申込期限・未確定事項を抽出します。ページと回答を見比べます。\n4. 「練習用の下書きフォーム」を開き、P04の後半を渡します。自動操作が使えなければ、人が入力します。\n5. 日付・時刻・定員・期限・未確定事項の欄を確認してから「下書きを確認」を押します。\n6. 表示された確認結果を見て、必要ならTXTを保存します。この教材に送信機能はありません。\n\nこのフォームはブラウザ内だけで動く練習用です。登録・応募・メール送信は行いません。再読み込みすると入力は消えます。\n一般の業務サイトでは、入力・下書き・送信・公開を区別して依頼します。AIが触るページと操作を指定し、進める前に内容を確認します。\nChromeサイドパネルのページ読み取りと、Desktopからブラウザを操作する機能では必要条件が異なります。画面に応じて公式ヘルプを参照してください。", "kind": "guide", "filename": "G03_ブラウザ実習の手順.txt", "links": [["練習用の説明会ページ", "demo/recruitment.html"], ["練習用の下書きフォーム", "demo/draft-form.html"]]}, {"id": "P04", "title": "ブラウザで使う依頼文", "text": "【前半：説明会ページを開いて渡す】\nいま開いている研修用の説明会ページを読み、名称・開催日・開始時刻・終了時刻・定員・申込期限・未確定事項を表にしてください。ページにない情報は「記載なし」としてください。根拠の見出しとページURLも添えてください。サイトへの入力や送信はまだしません。\n\n【後半：下書きフォームを開いて渡す】\n先ほど読み取った内容を、この練習用フォームへ入力してください。操作対象は、この練習ページの入力欄だけです。入力後にいったん止まり、私が確認するのを待ってください。「下書きを確認」ボタンは私が押します。ページを読み取れない場合は、推測で埋めずに知らせてください。", "kind": "guide", "filename": "P04_ブラウザで使う依頼文.txt"}, {"id": "G04", "title": "スマホ実習の手順", "text": "1. PCのClaudeで「研修1127_RC1127」という言葉を入れた会話を作り、T01・T02を渡して最新の説明会情報をまとめます。\n2. スマホのClaudeアプリで、PCと同じアカウント・同じ組織を選びます。\n3. 履歴から同じ会話を開きます。見つからない場合は、会話名・アカウント・通信状態を確認します。\n4. P05の依頼を、文字入力または音声入力で渡します。自動で新しい会話へ移っていないか確認します。\n5. PCへ戻り、スマホから加えた依頼と回答が同じ会話に見えるか確かめます。\n6. 必要なら、練習用の説明会ページをスマホで撮影し、＋から写真を添付して日時を読み取る補足デモをします。実在の応募者や社員情報を写さないでください。\n\n音声入力と音声モード\n・音声入力：話した内容を文字にする。送る前に文字を確認できます。\n・音声モード：音声で会話し、Claudeも音声で答えます。波形アイコンなどから開始します。\n・日本語設定や使える機能は画面・提供状況によって確認します。音声モードがない会話では文字入力か端末の音声入力で進めます。\n\n同じアカウントで会話を続けることと、PCのファイルがスマホへ自動保存されることは別です。PC内の接続フォルダへアクセスする作業は、Desktopアプリが開いていることなどの条件が必要です。\nスマホが使えない場合はPCの別ウィンドウで会話を探す練習に切り替え、「スマホ確認は未実施」と記録します。", "kind": "guide", "filename": "G04_スマホ実習の手順.txt", "links": [["Claudeの公式ダウンロード", "https://claude.com/download"]]}, {"id": "P05", "title": "スマホ・音声で使う依頼文", "text": "【同じ会話を開いて依頼】\nこの会話にある最新の説明会情報を、責任者への確認メモとして3点にまとめてください。日時・定員・未確定事項を入れ、元資料にない事実は加えないでください。\n\n【音声で話す例】\n「この説明会の確認事項を、短く3つ教えてください。まだ決まっていないことも分けてください。」\n\n【写真を使う補足デモ】\n「この研修用ページの写真から、開催日、開始時刻、終了時刻を読み取ってください。読めないところは不明と答えてください。」\n\n最後に画面の文字で内容を確認します。音声だけで日付や数字を判断しないでください。", "kind": "guide", "filename": "P05_スマホ・音声で使う依頼文.txt"}, {"id": "A01", "title": "最新情報と修正箇所の見本", "text": "【講師作成の確認見本。実際のClaude出力ではありません】\n正しい内容\n・名称：仕事紹介オンライン説明会\n・開催日：2026年12月10日（木）\n・開催時間：16:00〜16:45（T02による変更）\n・定員：30名（T02による変更）\n・開催方法：オンライン\n・申込期限：2026年12月8日（火）17:00\n・社内の原稿確認期限：2026年12月4日（金）12:00\n・未確定：申込URL、担当者名、録画配布\n\nT03で直す箇所\n1. 15:00〜15:45を16:00〜16:45へ変更する。\n2. 定員20名を30名へ変更する。\n3. 参加者への申込期限を12月8日17:00に直す。\n4. 録画を送るという確約を削除し、確認事項へ分ける。\n\n案内文の例\n仕事紹介オンライン説明会を12月10日（木）16:00〜16:45に開催します。仕事の紹介、1日の流れ、質疑応答を予定しています。定員は30名、申込期限は12月8日（火）17:00です。申込URLは【確認中】です。\n\nPC実習では、保存先とファイル本文も確認します。\nブラウザ実習では、下書きフォームに同じ日時・定員・期限が入るか確認します。\nスマホ実習では、同じ会話に依頼と回答が残るか確認します。", "kind": "guide", "filename": "A01_最新情報と修正箇所の見本.txt"}, {"id": "C01", "title": "結果の確認チェックリスト", "text": "□ 何を参照したか、ファイル名やページURLで説明できる。\n□ 最新のT02を反映し、16:00〜16:45・定員30名になっている。\n□ 申込期限12月8日17:00と、社内の原稿確認期限12月4日12:00を区別した。\n□ 未確定のURL・担当者・録画配布を勝手に確定していない。\n□ 元資料を残し、PCの保存先と修正版の中身を開いて確認した。\n□ GitHubの参照・修正案・保存・公開を区別できる。\n□ ブラウザで入力した内容を、ページの元情報と比べた。\n□ スマホでは同じアカウント・組織・会話を開いた。\n□ 実際に試した操作と、講師デモを見た操作を分けて記録した。\n\n責任者役：参照元、変更箇所、保存先、未確定事項を見て、修正点を具体的に伝える。", "kind": "guide", "filename": "C01_結果の確認チェックリスト.txt"}, {"id": "W01", "title": "実習の記録シート", "text": "氏名：\n業務：人事／採用／社内広報／責任者\n\n1. PCのファイル\n方法：添付／フォルダ接続／講師デモのみ\n参照したファイル：\n保存した場所とファイル名：\n中身を開いて確認したこと：\n\n2. GitHub\n方法：連携で参照／人が本文を渡した／講師デモのみ\n参照と変更の違い：\n\n3. ブラウザ\n方法：拡張機能で操作／手動でコピー・入力／講師デモのみ\n参照ページ：\n入力した内容と確認した項目：\n\n4. スマホ\n同じアカウント・組織：確認済み／未確認\n同じ会話を開いた：できた／未実施\nPCへ戻って追加の依頼を確認：できた／未実施\n音声：音声入力／音声モード／文字入力\n\n次に自分の業務で試すこと：\n対象資料・保存先：\n実施前に確認する社内ルール：\n最後に誰が何を確認するか：", "kind": "guide", "filename": "W01_実習の記録シート.txt"}, {"id": "Q01", "title": "振り返りクイズの答え", "text": "Q1：添付とフォルダ接続の違いは？\nA：添付は選んだファイルを渡す操作。フォルダ接続は許可したPC内の場所へアクセスする操作。変更の反映方法や保存先を確認します。\n\nQ2：GitHubの資料を読めたら、修正も保存済み？\nA：参照と保存は別です。修正案の表示、ファイルの変更、コミット、共有先への反映を分けて確認します。\n\nQ3：フォームに入力されたら、送信済み？\nA：入力と送信は別です。今回の練習フォームには送信機能がなく、ブラウザ内で確認するだけです。\n\nQ4：スマホでPCの続きが見つからないときは？\nA：アカウント・組織・会話・通信状態を確認します。PC内のファイルを使う作業では、Desktopの接続状態も確認します。", "kind": "guide", "filename": "Q01_振り返りクイズの答え.txt"}, {"id": "R01", "title": "利用条件と代替手順", "text": "公式情報の確認日：2026年11月27日\nClaudeの画面・利用条件は、契約プラン、組織の設定、段階的な提供で異なります。\n\nファイル添付：TXT教材を＋から追加します。ファイル作成が使えなければ、本文をコピーして自分で保存します。\nフォルダ接続：対応するClaude Desktopと許可されたフォルダを使います。使えなければ、添付方式で同じ資料を扱います。\nGitHub：接続できなければ、人が練習ファイルを開き、本文を渡します。連携の成功とは区別します。\nChrome拡張：対応プランと組織での利用許可が必要です。未導入なら、ページを開いて本文をコピーし、フォームは自分で入力します。\nスマホ：同じアカウント・組織で履歴を探します。端末を使えなければ、PCで確認メモを作り、スマホ実習は未実施と記録します。\n音声：音声モードの有無に合わせ、端末の音声入力や文字入力で代替できます。\n\nWeb・スマホからPCの接続フォルダを使う場合、Desktopアプリを開いておく必要があります。クラウド上の会話の継続と、PCへのアクセス条件は別です。\n本研修で扱うのは架空データだけです。会社で禁止された接続や拡張機能の導入を進める必要はありません。\n\n公式参照先\nClaude公式：ファイルの添付\nhttps://support.claude.com/en/articles/8241126-upload-files-to-claude\nClaude公式：PC・Web・スマホの違い\nhttps://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile\nClaude公式：Coworkの始め方\nhttps://support.claude.com/en/articles/13345190-get-started-with-claude-cowork\nClaude公式：GitHub連携\nhttps://support.claude.com/en/articles/10167454-use-the-github-integration\nClaude公式：Chrome拡張の始め方\nhttps://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome\nClaude公式：音声モード\nhttps://support.claude.com/en/articles/11101966-use-voice-mode", "kind": "guide", "filename": "R01_利用条件と代替手順.txt"}, {"id": "P06", "title": "実演① ページを読む依頼文", "text": "研修の実演です。操作対象は現在開いている https://t-arano.github.io/dmmix-ai-training/lesson4-original/demo/recruitment.html だけに限定してください。他のタブや社内データは参照しません。\n\nこの練習用の説明会ページを読み、名称・開催日・開始時刻・終了時刻・定員・申込期限・未確定事項を表にしてください。ページにない情報は「記載なし」とし、根拠の見出しとページURLも添えてください。更新履歴の旧情報ではなく、開催概要の最新情報を使ってください。サイトへの入力や送信はまだ行いません。", "kind": "guide", "filename": "P06_実演① ページを読む依頼文.txt"}, {"id": "P07", "title": "実演② フォームに入力する依頼文", "text": "次に、研修用の下書きフォーム https://t-arano.github.io/dmmix-ai-training/lesson4-original/demo/draft-form.html を開き、先ほど読み取った内容を各入力欄へ入力してください。操作対象はこのフォームだけです。参照元には説明会ページのURLを入れてください。\n\n入力が終わったら止まり、確認を待ってください。「下書きを確認」と保存のボタンは押さないでください。", "kind": "guide", "filename": "P07_実演② フォームに入力する依頼文.txt"}, {"id": "G05", "title": "スクリーンショット付き実演の操作手順", "text": "ブラウザ実演を自分で試す手順（画面写真：2026年11月27日）\n第4回・当初カリキュラム版の19〜26ページに、8段階の実画面があります。\n写真をクリックすると拡大できます。これは講師のChromeとClaude拡張で実行した画面です。回答の文章や画面の配置は、利用環境によって変わります。\n\n準備\nPCのGoogle Chromeを使います。会社で利用を認められたClaude拡張と、各自のClaudeアカウントを使ってください。未導入・利用できない場合は、R01の方法で手動入力します。\nブラウザ実習には、ZIP内のローカルページではなく、下記の公開済み練習URLを使います。\n説明会：https://t-arano.github.io/dmmix-ai-training/lesson4-original/demo/recruitment.html\nフォーム：https://t-arano.github.io/dmmix-ai-training/lesson4-original/demo/draft-form.html\n\n1｜説明会ページを開く（19ページ）\n資料の「説明会ページをChromeで開く」をクリックします。別のブラウザで開いた場合は、URLをChromeに貼り付けます。「仕事紹介オンライン説明会」が表示されることを確認します。\n\n2｜Claude拡張を開く（20ページ）\nChrome右上の拡張機能（パズル形）→「Claude」を選びます。固定済みならClaudeのアイコンからでも開けます。右側にClaudeの入力欄が出ます。\n別の会話が開いた場合は「新規セッション」から始めます。必要に応じて各自のアカウントでログインします。画面に表示されているモデル名や権限モードを、講師と同じものに変更する必要はありません。\n\n3｜ページを読ませる（21ページ）\nP06「実演① ページを読む依頼文」を開き、本文をコピーします。またはページ右側の「依頼文をコピー」を使います。\nClaudeの入力欄をクリックし、WindowsはCtrl+V、MacはCommand+Vで貼り付けます。入力欄右下の上向き矢印でClaudeへ依頼します。ページのフォームへ送信する操作ではありません。\n\n4｜表の内容を照合する（22ページ）\n回答が終わるまで待ちます。元ページの「開催概要」「確認中の項目」と比べてください。\n名称：仕事紹介オンライン説明会\n開催日：2026年12月10日（木）\n開始時刻：16:00／終了時刻：16:45\n定員：30名\n申込期限：2026年12月8日（火）17:00\n未確定：申込URL、担当者名、録画配布の有無\n更新履歴の旧時刻15:00〜15:45・旧定員20名を使っていないか確認します。\n誤りがあれば「開催概要をもう一度読み、日時・定員・申込期限を確認してください」と修正を頼みます。\n\n5｜同じ会話で入力を依頼する（23ページ）\nP07「実演② フォームに入力する依頼文」をコピーし、同じClaudeの返信欄に貼り付けて依頼します。新しい会話は作りません。\n依頼文にフォームのURLが入っているので、Claudeがフォームを開いて入力します。今回は「下書きを確認」と保存のボタンを押さずに停止するよう指定しています。\n\n6｜8項目を確認する（24ページ）\nClaudeが止まったら、実際の入力欄を上から下までスクロールして確認します。\n説明会名／開催日／定員／開始時刻／終了時刻／申込期限／未確定の項目／参照元のページ・資料の8項目です。\n値は4の一覧と同じです。参照元は説明会ページのURLです。間違いは手で修正するか、Claudeへ修正箇所だけを具体的に依頼してください。\n元ページを見直すには、フォーム上部の「説明会ページを別タブで開く」を使います。入力中のフォームは再読み込みしないでください。\n\n7｜自分で確認ボタンを押す（25ページ）\n内容が合っていたら、参加者本人が「下書きを確認」を押します。フォームの下に「入力した下書き」が表示されます。\n本文を見てから「下書きをTXTで保存」を押します。この練習フォームの確認・保存は、応募受付や外部への送信を行いません。\n\n8｜保存したファイルを開く（26ページ）\nChrome右上のダウンロード（下向き矢印）を開き、「説明会案内_下書き.txt」を選びます。通常はダウンロードフォルダに入ります。保存先の選択画面が出た場合は、自分が指定した場所を開きます。\n同名ファイルがあると末尾に番号が付くことがあります。保存したTXTを開き、開催時間16:00〜16:45・定員30名・申込期限12月8日17:00を確認します。\nW01へ「拡張機能で操作」または「手動で入力」、保存先とファイル名を記録すれば完了です。\n\nうまく進まない場合\n・Claudeがページを読めない：対象URL・ログイン・会社の利用設定を確認。推測で入力せず、ページ本文をコピーして渡します。\n・入力が始まらない：同じ会話で依頼したか、操作対象のURLが正しいかを確認します。利用できなければ自分でフォームへ入力します。\n・再読み込みで入力が消えた：同じ会話でP07をもう一度依頼します。保存済みTXTがあれば中身も確認します。\n・写真と画面が違う：モデル名ではなく、入力欄・返信欄・確認ボタン・保存ボタンを目印にします。", "kind": "guide", "filename": "G05_スクリーンショット付き実演の操作手順.txt"}], "prompts": {"browser_read": {"title": "実演① ページを読む依頼文", "text": "研修の実演です。操作対象は現在開いている https://t-arano.github.io/dmmix-ai-training/lesson4-original/demo/recruitment.html だけに限定してください。他のタブや社内データは参照しません。\n\nこの練習用の説明会ページを読み、名称・開催日・開始時刻・終了時刻・定員・申込期限・未確定事項を表にしてください。ページにない情報は「記載なし」とし、根拠の見出しとページURLも添えてください。更新履歴の旧情報ではなく、開催概要の最新情報を使ってください。サイトへの入力や送信はまだ行いません。", "resources": []}, "browser_fill": {"title": "実演② フォームに入力する依頼文", "text": "次に、研修用の下書きフォーム https://t-arano.github.io/dmmix-ai-training/lesson4-original/demo/draft-form.html を開き、先ほど読み取った内容を各入力欄へ入力してください。操作対象はこのフォームだけです。参照元には説明会ページのURLを入れてください。\n\n入力が終わったら止まり、確認を待ってください。「下書きを確認」と保存のボタンは押さないでください。", "resources": []}}, "sources": [{"id": "upload", "title": "Claude公式：ファイルの添付", "url": "https://support.claude.com/en/articles/8241126-upload-files-to-claude"}, {"id": "cowork", "title": "Claude公式：PC・Web・スマホの違い", "url": "https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile"}, {"id": "start", "title": "Claude公式：Coworkの始め方", "url": "https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork"}, {"id": "github", "title": "Claude公式：GitHub連携", "url": "https://support.claude.com/en/articles/10167454-use-the-github-integration"}, {"id": "chrome", "title": "Claude公式：Chrome拡張の始め方", "url": "https://support.claude.com/en/articles/12012173-get-started-with-claude-in-chrome"}, {"id": "voice", "title": "Claude公式：音声モード", "url": "https://support.claude.com/en/articles/11101966-use-voice-mode"}], "demoPage": 7, "exercisePage": 10, "walkthroughPage": 19, "demoLinks": [["Claudeを開く", "https://claude.ai/"], ["練習用フォルダZIPを保存", "practice-files.zip"], ["説明会ページを開く", "demo/recruitment.html"], ["下書きフォームを開く", "demo/draft-form.html"], ["GitHubの練習ファイル", "https://github.com/t-arano/dmmix-ai-training/blob/main/lesson4-original/demo/source-notes.md"]]};
const $=s=>document.querySelector(s),total=DATA.slides.length,modal=$('#modal');
let current=0,roleKey='hr',toastTimer;
const RES=new Map(DATA.resources.map(r=>[r.id,r]));
function openScreenshot(src,title){
 showModal(title+'｜画面写真','');
 modal.classList.add('image-modal');
 const img=el('img',undefined,'zoom-image');img.src=src;img.alt=title+'：実際のChrome画面';
 $('#modal-body').replaceChildren(img,el('p','実画面の必要な範囲を掲載しています。2026年11月27日撮影。','image-caption'));
}

function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function button(parent,label,fn,cls='wide'){const b=el('button',label,cls);b.onclick=fn;parent.append(b);return b;}
function external(parent,label,url,cls='action'){const a=el('a',label,cls);a.href=url;if(/\.zip$/.test(url)){a.download=url.split('/').pop();}else{a.target='_blank';a.rel='noopener noreferrer';}parent.append(a);return a;}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',4500);}
function showModal(title,text,actions=[]){modal.classList.remove('image-modal');$('#modal-title').textContent=title;$('#modal-body').replaceChildren(el('pre',text));$('#modal-foot').replaceChildren();actions.forEach(a=>button($('#modal-foot'),a.label,a.fn,a.primary?'primary':''));if(!modal.open)modal.showModal();$('#modal-body').scrollTop=0;}
function manualCopy(text){showModal('文章を選択してコピー','Macは Command+C、Windowsは Ctrl+C でコピーしてください。');const area=el('textarea');area.value=text;area.setAttribute('aria-label','手動コピー用の文章');$('#modal-body').append(area);area.focus();area.select();}
async function copyText(text){let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}if(!ok){const area=el('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';(modal.open?$('#modal-body'):document.body).append(area);area.select();try{ok=document.execCommand('copy');}catch(e){}area.remove();}if(ok)toast('コピーしました。Claudeやメモ欄に貼り付けて使えます。');else manualCopy(text);}
function download(name,text){const url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}));const a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function openResource(id){const r=RES.get(id);if(!r)return;showModal(r.id+'｜'+r.title,r.text,[{label:'本文をコピー',fn:()=>copyText(r.text),primary:true},{label:'TXTを保存',fn:()=>download(r.filename,r.text)},{label:'手動コピー',fn:()=>manualCopy(r.text)},{label:'教材一覧へ',fn:resources}]);if(r.links){const links=el('div',undefined,'live-links');for(const [label,url] of r.links)external(links,label,url);$('#modal-body').prepend(links);}if(['case'].includes(r.kind))$('#modal-body').prepend(el('span','研修用の架空データ｜この画面内で開いています','resource-label'));}
function activeKey(){const s=DATA.slides[current];return s.role?roleKey:s.prompt;}
function bundledPrompt(key){const p=DATA.prompts[key];let text=p.text;if(p.resources.length)text+='\n\n【今回使う教材】\n\n'+p.resources.map(id=>RES.get(id).text).join('\n\n────────────\n\n');return text;}
function viewPrompt(key){const p=DATA.prompts[key];showModal(p.title,p.text,[{label:'依頼文をコピー',fn:()=>copyText(p.text),primary:true},{label:'手動コピー',fn:()=>manualCopy(p.text)},...(p.resources.length?[{label:'教材＋依頼文をコピー',fn:()=>copyText(bundledPrompt(key))}]:[])]);}
function renderGraphicSlide(s){
 const target=$('#slide');target.replaceChildren();target.className='slide gragreco '+s.graphicKind;
 target.append(el('p','Claude　/　PC・ブラウザ・スマホ','kicker'));
 const h=el('h2');h.id='slide-title';s.title.split('\n').forEach((line,i)=>{if(i)h.append(document.createElement('br'));h.append(document.createTextNode(line));});target.append(h);
 const content=el('div',undefined,'graphic-body');content.innerHTML=s.graphic;target.append(content);content.querySelectorAll('[data-screenshot]').forEach(b=>b.onclick=()=>openScreenshot(b.dataset.screenshot,s.title));
 if(s.foot)target.append(el('p',s.foot,'foot'));
 const folio=el('div',undefined,'folio');folio.append(el('span','AIブーストカレッジ　2026年11月27日'),el('span',String(current+1).padStart(2,'0')));target.append(folio);
}
function renderSlide(s){if(s.graphic){renderGraphicSlide(s);return;}const target=$('#slide');target.replaceChildren();target.className='slide '+s.kind;target.append(el('p','Workspace Studio　/　Forms・Gemini・Sheets・Docs','kicker'));const h=el('h2');h.id='slide-title';s.title.split('\n').forEach((line,i)=>{if(i)h.append(document.createElement('br'));h.append(document.createTextNode(line));});target.append(h);if(s.lead)target.append(el('p',s.lead,'lead'));
 if(s.rows){if(s.kind==='table'){const table=el('table');const body=el('tbody');for(const row of s.rows){const tr=el('tr');row.forEach((t,i)=>{const c=el(i===0?'th':'td',t);if(i===0)c.scope='row';tr.append(c)});body.append(tr)}table.append(body);target.append(table)}else{const rows=el('div',undefined,'rows');for(const [label,text] of s.rows){const row=el('div',undefined,'row');row.append(el('div',label,'label'),el('div',text));rows.append(row)}target.append(rows)}}
 if(s.items){const list=el('ol',undefined,'questions');s.items.forEach(t=>list.append(el('li',t)));target.append(list)}
 if(s.kind==='sources'){const list=el('ul',undefined,'source-links');DATA.sources.filter(r=>!s.refs||s.refs.includes(r.id)).forEach(r=>{const li=el('li');external(li,r.title,r.url,'');list.append(li)});target.append(list)}
 if(s.foot)target.append(el('p',s.foot,'foot'));
 const folio=el('div',undefined,'folio');folio.append(el('span','AIブーストカレッジ　2026年11月27日'),el('span',String(current+1).padStart(2,'0')));target.append(folio);
}
function renderPanel(){const s=DATA.slides[current],p=$('#panel');p.replaceChildren();p.hidden=!(s.resources?.length||s.prompt||s.answer||s.links?.length||s.refs?.length);if(p.hidden)return;
p.append(el('div','教材をクリックして開く','eyebrow'),el('h3','このページの教材と操作'));
if(s.screenshot)button(p,'画面写真を拡大',()=>openScreenshot(s.screenshot,s.title));
for(const id of s.resources||[])button(p,RES.get(id).title+'を開く',()=>openResource(id));
if(s.prompt){button(p,'依頼文を見る',()=>viewPrompt(s.prompt));button(p,'依頼文をコピー',()=>copyText(DATA.prompts[s.prompt].text),'primary wide');p.append(el('p','Claudeの会話欄へ貼り付けます。','tip'));}
if(s.links?.length){p.append(el('hr'));for(const [label,url] of s.links)external(p,label,url);}
if(s.answer)button(p,s.answer==='Q01'?'クイズの答えを見る':'完成見本を見る',()=>openResource(s.answer),'textlink');
if(s.refs?.length){p.append(el('hr'));for(const id of s.refs){const ref=DATA.sources.find(x=>x.id===id);external(p,ref.title,ref.url,'source-action');}}
}
function go(index,updateHash=true){current=Math.max(0,Math.min(total-1,Number.isFinite(index)?index:0));const s=DATA.slides[current];renderSlide(s);renderPanel();$('#count').textContent=`${current+1} / ${total}`;$('#select').value=String(current);$('#time').textContent=s.time;$('#prev').disabled=current===0;$('#next').disabled=current===total-1;$('#progress').style.width=((current+1)/total*100)+'%';$('#caption').textContent=$('#panel').hidden?'「次へ」またはキーボードの → で進みます。':'教材は右側のボタンから開けます。スマホではスライドの下に表示されます。';if(updateHash)history.replaceState(null,'','#page='+(current+1));document.title=`${current+1}/${total} ${s.title.replaceAll('\n',' ')}｜第4回 当初カリキュラム版`;}
function resources(){showModal('教材一覧','');const body=$('#modal-body');body.replaceChildren(el('p','「開く」を押すと本文がすぐ表示されます。教材はすべてこのHTMLに入っています。','notice'));if(location.protocol!=='file:'){const a=el('a','資料・教材をまとめて保存（ZIP）','action');a.href='training-kit.zip';a.download='第4回_当初カリキュラム_研修セット.zip';body.append(a);}DATA.resources.forEach(r=>{const row=el('div',undefined,'resource-item');row.append(el('span',r.id+'｜'+r.title));button(row,'開く',()=>openResource(r.id),'');button(row,'TXT保存',()=>download(r.filename,r.text),'');body.append(row)});}
function demoAssets(){showModal('実習を始める','');const b=$('#modal-body');b.replaceChildren(el('p','教材はすべて架空データです。Claudeは各自のアカウントで使います。練習用フォームには送信機能がありません。','notice'));const links=el('div',undefined,'live-links');for(const [label,url] of DATA.demoLinks)external(links,label,url);b.append(links);button(b,'PCファイル実習の手順を開く',()=>openResource('G01'));button(b,'スクリーンショット付き手順へ（19ページ）',()=>{modal.close();go(DATA.walkthroughPage-1);});button(b,'ブラウザ実習の手順を開く',()=>openResource('G03'));button(b,'スマホ実習の手順を開く',()=>openResource('G04'));button(b,'利用条件と代替手順を開く',()=>openResource('R01'));}
function help(){showModal('この研修資料の使い方','');const b=$('#modal-body');b.replaceChildren();const list=el('ol',undefined,'help-text');['「次へ」「前へ」または左右矢印で進みます。下の一覧からページを選べます。','「デモへ」は7ページ、「演習へ」は10ページです。本編36ページと補足2ページ、全38ページの60分研修です。19〜26ページは実演・実習中に使う画面付き手順です。','教材ボタンを押すと、この画面内で本文が開きます。「本文をコピー」「TXTを保存」が使えます。','「練習用フォルダZIP」を展開してPCの実習に使います。研修セット全体のZIPとは別のファイルです。','説明会ページと下書きフォームは、クリックすると別タブで開きます。フォームは外部へ送信しません。','Claudeの機能は、プラン・組織の設定・提供状況によって異なります。使えない場合はR01の代替手順で進めます。','A01の完成見本は講師作成です。19〜26ページの写真はClaude拡張を実際に操作した画面です。写真をクリックすると拡大でき、「実演の手順」から移動できます。','「研修一覧へ」から、既存のプロジェクト・スキル資料なども選べます。'].forEach(t=>list.append(el('li',t)));b.append(list);}
DATA.slides.forEach((s,i)=>{const o=el('option',`${String(i+1).padStart(2,'0')}　${s.title.replaceAll('\n',' ')}`);o.value=String(i);$('#select').append(o)});
$('#next').onclick=()=>go(current+1);$('#prev').onclick=()=>go(current-1);$('#select').onchange=e=>go(Number(e.target.value));$('#jump-demo').onclick=()=>go(DATA.demoPage-1);$('#jump-walkthrough').onclick=()=>go(DATA.walkthroughPage-1);$('#jump-exercise').onclick=()=>go(DATA.exercisePage-1);$('#resources').onclick=resources;$('#demo-assets').onclick=demoAssets;$('#help').onclick=help;
$('#close-modal').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('ブラウザの全画面表示をご利用ください。');}catch(e){toast('ブラウザの全画面表示をご利用ください。');}};
document.addEventListener('keydown',e=>{if(modal.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(total-1)}});
function hashPage(){const m=location.hash.match(/^#page=(\d+)$/);return m?Number(m[1])-1:0;}
window.addEventListener('hashchange',()=>go(hashPage(),false));go(hashPage());
</script>
</body>
